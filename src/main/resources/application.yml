server:
  port: 8080

spring:
  application:
    name: ford-challenge-backend
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/ford_challenge}
    username: ${APP_DB_USERNAME:ford}
    password: ${APP_DB_PASSWORD:ford123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${APP_JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGtleSBmb3IgdGVzdGluZyBwdXJwb3NlcyBvbmx5}
    jwt-expiration-ms: 900000
    jwt-refresh-expiration-ms: 604800000
    payload-secret: ${APP_PAYLOAD_SECRET:}
    cors-allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "https://app.fordchallenge.com"
  integration:
    fipe:
      base-url: ${FIPE_BASE_URL:https://fipe.parallelum.com.br/api/v2}
      token: ${FIPE_TOKEN:}
      timeout-millis: 5000
    carapi:
      base-url: ${CAR_API_BASE_URL:https://carapi.app/api}
      api-token: ${CAR_API_API_TOKEN:}
      api-secret: ${CAR_API_API_SECRET:}
      timeout-millis: 5000

---
spring:
  config:
    activate:
      on-profile: ssl
server:
  port: 8443
  ssl:
    enabled: true
    key-store-type: PKCS12
    key-store: classpath:keystore/ford-challenge-dev.p12
    key-store-password: changeit
    key-alias: ford-challenge-dev
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers: >-
      TLS_AES_256_GCM_SHA384,
      TLS_AES_128_GCM_SHA256,
      TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
