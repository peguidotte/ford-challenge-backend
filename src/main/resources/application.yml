server:
  port: 8080

spring:
  application:
    name: ford-challenge-backend
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/ford_challenge}
    username: ${APP_DB_USERNAME:ford}
    password: ${APP_DB_PASSWORD:ford123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${APP_JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGtleSBmb3IgdGVzdGluZyBwdXJwb3NlcyBvbmx5}
    jwt-expiration-ms: 900000
    jwt-refresh-expiration-ms: 604800000
    cors-allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "https://app.fordchallenge.com"
  integration:
    fipe:
      base-url: ${FIPE_BASE_URL:https://fipe.parallelum.com.br/api/v2}
      token: ${FIPE_TOKEN:}
      timeout-millis: 5000
    carapi:
      base-url: ${CAR_API_BASE_URL:https://carapi.app/api}
      api-token: ${CAR_API_API_TOKEN:}
      api-secret: ${CAR_API_API_SECRET:}
      timeout-millis: 5000
