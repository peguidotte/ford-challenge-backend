services:
  postgres:
    image: postgres:17
    container_name: ford-challenge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ford_challenge}
      POSTGRES_USER: ${POSTGRES_USER:-ford}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ford123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ford} -d ${POSTGRES_DB:-ford_challenge}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
